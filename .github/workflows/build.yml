name: Build MaxDisplay

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.deleted != true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            artifact: maxdisplay-macos-arm64
            path: maxdisplay-macos-arm64.tar.gz
          - name: Windows x64
            runner: windows-2022
            artifact: maxdisplay-windows-x64
            path: build/Release/maxdisplay.exe

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DBUILD_TESTING=ON

      - name: Locate or install NASM for the x64 AV1 codec
        if: runner.os == 'Windows'
        run: |
          if (Get-Command nasm -ErrorAction SilentlyContinue) { exit 0 }
          $dir = Join-Path $env:ProgramFiles 'NASM'
          if (-not (Test-Path "$dir/nasm.exe")) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path "$dir/nasm.exe") { $dir >> $env:GITHUB_PATH }
          elseif (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { throw "NASM executable not found" }

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - &media-foundation
        name: Enable Media Foundation on Windows Server
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-WindowsFeature Server-Media-Foundation).Installed) {
            $result = Install-WindowsFeature Server-Media-Foundation -ErrorAction Stop
            if (-not $result.Success) { throw "Media Foundation installation failed" }
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Check macOS executable and preserve its file mode
        if: runner.os == 'macOS'
        run: |
          ./build/Release/maxdisplay --help
          tar -C build/Release -czf maxdisplay-macos-arm64.tar.gz maxdisplay

      - name: Check Windows executable
        if: runner.os == 'Windows'
        run: .\build\Release\maxdisplay.exe --help

      - name: Stage binary for the tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 1
          if-no-files-found: error

      - name: Store Windows test executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-video-tests
          path: |
            build/Release/codec_probe.exe
            build/Release/windows_present_tests.exe
          retention-days: 1
          if-no-files-found: error

      - name: Encode H.264 and AV1 test patterns on Mac
        if: runner.os == 'macOS'
        run: |
          ./build/Release/codec_probe h264.frames h264
          ./build/Release/codec_probe av1.frames av1

      - name: Store encoded test fixture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: mac-encoded-fixture
          path: |
            h264.frames
            av1.frames
          retention-days: 1
          if-no-files-found: error

  codec-interop:
    name: Decode and display Mac test pattern on Windows
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mac-encoded-fixture
          path: fixture
      - uses: actions/download-artifact@v8
        with:
          name: windows-video-tests
          path: tools
      - *media-foundation
      - name: Check H.264 and AV1 decoded pixels and frame order
        run: |
          foreach ($codec in 'h264', 'av1') {
            .\tools\codec_probe.exe "fixture/$codec.frames" $codec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check live Windows presentation over TCP and UDP
        run: |
          foreach ($codec in 'h264', 'av1') {
            foreach ($transport in 'tcp', 'udp') {
              .\tools\windows_present_tests.exe "fixture/$codec.frames" $codec $transport
              if ($LASTEXITCODE -eq 77) {
                Write-Warning "Window readback skipped in this desktop session."
                exit 0
              }
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

  release:
    name: Publish binaries to GitHub Releases
    needs: codec-interop
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: maxdisplay-macos-arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: maxdisplay-windows-x64
          path: dist
      - name: Publish assets for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mv dist/maxdisplay.exe dist/maxdisplay-windows-x64.exe
          assets=(dist/maxdisplay-macos-arm64.tar.gz dist/maxdisplay-windows-x64.exe)
          for file in "${assets[@]}"; do test -s "$file"; done

          if release=$(gh release view --json isDraft,assets -- "$TAG"); then
            for file in "${assets[@]}"; do
              if ! jq -e --arg name "${file##*/}" 'any(.assets[]; .name == $name and .size > 0)' <<<"$release" >/dev/null; then
                gh release upload --clobber -- "$TAG" "$file"
              fi
            done
            if jq -e '.isDraft' <<<"$release" >/dev/null; then
              gh release edit --draft=false -- "$TAG"
            fi
          else
            gh release create --verify-tag --generate-notes --title "$TAG" -- "$TAG" "${assets[@]}"
          fi
